<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domainmont · coming soon</title>
  <!-- Google Fonts + Font Awesome for clean icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d15;
      color: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated gradient orb */
    .orb {
      position: absolute;
      width: 40vw;
      height: 40vw;
      max-width: 700px;
      max-height: 700px;
      background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.08) 70%);
      border-radius: 50%;
      top: -10%;
      right: -10%;
      filter: blur(100px);
      z-index: 0;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-secondary {
      position: absolute;
      width: 30vw;
      height: 30vw;
      max-width: 500px;
      max-height: 500px;
      background: radial-gradient(circle at 70% 60%, rgba(45, 212, 191, 0.2), rgba(16, 185, 129, 0.05) 70%);
      border-radius: 50%;
      bottom: -8%;
      left: -8%;
      filter: blur(90px);
      z-index: 0;
      animation: floatOrb 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 6%) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 880px;
      width: 100%;
      background: rgba(18, 22, 36, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 3.5rem;
      padding: 3.5rem 3rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.3s ease;
    }

    @media (max-width: 600px) {
      .card {
        padding: 2.2rem 1.5rem;
        border-radius: 2.5rem;
      }
    }

    /* header / logo */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .brand-icon {
      font-size: 2.4rem;
      color: #a5b4fc;
      background: rgba(165, 180, 252, 0.08);
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      border: 1px solid rgba(165, 180, 252, 0.15);
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5b4fc 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tag {
      font-size: 0.9rem;
      font-weight: 400;
      color: #94a3b8;
      margin-left: 0.4rem;
      letter-spacing: 0.3px;
      background: rgba(148, 163, 184, 0.08);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      -webkit-text-fill-color: #94a3b8;
    }

    /* main content */
    .hero {
      margin: 1.2rem 0 2.8rem 0;
    }

    .hero h1 {
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #f0f4ff, #c7d2fe, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
    }

    .hero h1 i {
      font-weight: 300;
      background: none;
      -webkit-text-fill-color: #818cf8;
      margin: 0 0.1rem;
    }

    .hero p {
      font-size: 1.25rem;
      color: #cbd5e1;
      max-width: 520px;
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .hero p strong {
      color: #e0e7ff;
      font-weight: 500;
      background: rgba(165, 180, 252, 0.08);
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      border: 1px solid rgba(165, 180, 252, 0.08);
    }

    /* countdown / coming soon chip */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.2rem;
      margin: 2rem 0 2.8rem 0;
    }

    .chip {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.4rem 0.5rem 1rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: #e2e8f0;
    }

    .chip i {
      color: #818cf8;
      font-size: 0.95rem;
    }

    .chip .badge {
      background: rgba(99, 102, 241, 0.18);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .chip .highlight {
      background: rgba(45, 212, 191, 0.12);
      color: #5eead4;
      border: 1px solid rgba(45, 212, 191, 0.15);
    }

    /* form */
    .notify-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.8rem;
    }

    .notify-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .input-wrapper {
      flex: 1 1 260px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.6rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .input-wrapper:focus-within {
      border-color: rgba(165, 180, 252, 0.35);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.08);
    }

    .input-wrapper i {
      color: #94a3b8;
      font-size: 0.95rem;
      opacity: 0.7;
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      padding: 0.9rem 1rem 0.9rem 0.8rem;
      font-size: 0.95rem;
      color: #f1f5f9;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #818cf8, #6366f1);
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 0.2px;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary i {
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #929cff, #7275f5);
      box-shadow: 0 12px 28px -10px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .note {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.2rem;
      letter-spacing: 0.2px;
    }

    .note i {
      color: #4f46e5;
      font-size: 0.7rem;
      opacity: 0.7;
    }

    /* social / footer */
    .footer-links {
      margin-top: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 2rem;
    }

    .socials {
      display: flex;
      gap: 1.2rem;
    }

    .socials a {
      color: #94a3b8;
      font-size: 1.3rem;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.02);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
    }

    .socials a:hover {
      color: #e0e7ff;
      background: rgba(165, 180, 252, 0.06);
      border-color: rgba(165, 180, 252, 0.1);
      transform: translateY(-3px);
    }

    .copy {
      font-size: 0.8rem;
      color: #475569;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .copy i {
      color: #4f46e5;
      font-size: 0.7rem;
    }

    /* responsive touches */
    @media (max-width: 640px) {
      .hero h1 {
        font-size: 2.6rem;
      }
      .hero p {
        font-size: 1rem;
      }
      .brand-name {
        font-size: 1.6rem;
      }
      .input-wrapper {
        flex: 1 1 100%;
      }
      .btn-primary {
        width: 100%;
        justify-content: center;
        padding: 0.9rem 1.5rem;
      }
      .footer-links {
        flex-direction: column-reverse;
        gap: 1.8rem;
        align-items: flex-start;
      }
      .socials a {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }

    @media (max-width: 450px) {
      .card {
        padding: 1.8rem 1.2rem;
      }
      .brand-icon {
        width: 48px;
        height: 48px;
        font-size: 1.8rem;
      }
    }

    /* extra micro-interaction */
    .glow-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- animated background orbs -->
  <div class="orb"></div>
  <div class="orb-secondary"></div>

  <main class="card">
    <!-- brand -->
    <div class="brand">
      <div class="brand-icon">
        <i class="fas fa-cubes"></i>
      </div>
      <span class="brand-name">Domainmont</span>
      <span class="brand-tag">web properties</span>
    </div>

    <!-- hero -->
    <div class="hero">
      <h1>
        <i class="fas fa-arrow-trend-up" style="font-size: 2.8rem; vertical-align: middle; margin-right: 0.2rem;"></i> 
        coming <span style="font-weight: 300;">soon</span>
      </h1>
      <p>
        <strong>Domainmont</strong> builds premium web properties 
        — modern, fast, and crafted for impact. 
        <span style="display: inline-block; margin-top: 0.4rem;">We're launching something fresh. Stay tuned.</span>
      </p>
    </div>

    <!-- chips / status -->
    <div class="chip-group">
      <span class="chip">
        <i class="fas fa-code"></i> 
        <span>Web properties</span>
        <span class="badge">craft</span>
      </span>
      <span class="chip">
        <i class="fas fa-calendar-check"></i> 
        <span>Q3 2026</span>
        <span class="badge highlight"><i class="fas fa-clock" style="margin-right: 4px;"></i>coming</span>
      </span>
      <span class="chip">
        <i class="fas fa-rocket"></i> 
        <span>early access</span>
      </span>
    </div>

    <!-- notify form -->
    <div class="notify-section">
      <div class="notify-row">
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="your@email.com" aria-label="Email for notification" />
        </div>
        <button class="btn-primary">
          <i class="fas fa-paper-plane"></i> Notify me
        </button>
      </div>
      <div class="note">
        <i class="fas fa-circle-check"></i> 
        <span>No spam, just launch updates &amp; early access.</span>
      </div>
    </div>

    <!-- footer / socials -->
    <div class="footer-links">
      <div class="copy">
        <i class="fas fa-copyright"></i> 2026 Domainmont · built with <i class="fas fa-heart" style="color: #818cf8; font-size: 0.7rem;"></i>
      </div>
      <div class="socials">
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </main>
</body>
</html>
