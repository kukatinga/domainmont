<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="icons8-web-94.png" type="image/png" sizes="24x24">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domainmont · coming soon</title>
  <!-- Google Fonts + Font Awesome for clean icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0c10;
      color: #eef2f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated gradient orb — dark, no purple */
    .orb {
      position: absolute;
      width: 40vw;
      height: 40vw;
      max-width: 700px;
      max-height: 700px;
      background: radial-gradient(circle at 30% 40%, rgba(70, 80, 100, 0.3), rgba(30, 40, 55, 0.1) 70%);
      border-radius: 50%;
      top: -10%;
      right: -10%;
      filter: blur(100px);
      z-index: 0;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-secondary {
      position: absolute;
      width: 30vw;
      height: 30vw;
      max-width: 500px;
      max-height: 500px;
      background: radial-gradient(circle at 70% 60%, rgba(50, 60, 75, 0.25), rgba(20, 28, 38, 0.05) 70%);
      border-radius: 50%;
      bottom: -8%;
      left: -8%;
      filter: blur(90px);
      z-index: 0;
      animation: floatOrb 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 6%) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 10;
      max-width: 880px;
      width: 100%;
      background: rgba(16, 20, 28, 0.8);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-radius: 3.5rem;
      padding: 3.5rem 3rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }

    @media (max-width: 600px) {
      .card {
        padding: 2.2rem 1.5rem;
        border-radius: 2.5rem;
      }
    }

    /* header / logo */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .brand-icon {
      font-size: 2.4rem;
      color: #a0aec0;
      background: rgba(160, 174, 192, 0.06);
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      border: 1px solid rgba(160, 174, 192, 0.1);
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .brand-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e2e8f0 0%, #a0aec0 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tag {
      font-size: 0.9rem;
      font-weight: 400;
      color: #8a9aa8;
      margin-left: 0.4rem;
      letter-spacing: 0.3px;
      background: rgba(138, 154, 168, 0.06);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid rgba(138, 154, 168, 0.08);
      -webkit-text-fill-color: #8a9aa8;
    }

    /* main content */
    .hero {
      margin: 1.2rem 0 2.8rem 0;
    }

    .hero h1 {
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #edf2f7, #cbd5e0, #a0aec0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.2rem;
    }

    .hero h1 i {
      font-weight: 300;
      background: none;
      -webkit-text-fill-color: #9aa9b9;
      margin: 0 0.1rem;
    }

    .hero p {
      font-size: 1.25rem;
      color: #b8c4d0;
      max-width: 520px;
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .hero p strong {
      color: #e2e8f0;
      font-weight: 500;
      background: rgba(160, 174, 192, 0.06);
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      border: 1px solid rgba(160, 174, 192, 0.08);
    }

    /* countdown / coming soon chip */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.2rem;
      margin: 2rem 0 2.8rem 0;
    }

    .chip {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1.4rem 0.5rem 1rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: #d0d9e2;
    }

    .chip i {
      color: #8a9aa8;
      font-size: 0.95rem;
    }

    .chip .badge {
      background: rgba(120, 135, 150, 0.15);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #b0bec5;
      border: 1px solid rgba(120, 135, 150, 0.15);
    }

    .chip .highlight {
      background: rgba(90, 110, 130, 0.2);
      color: #b8c9d9;
      border: 1px solid rgba(90, 110, 130, 0.2);
    }

    /* contact section — clean email link */
    .contact-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.8rem;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    /* email link styled as a subtle button */
    .email-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      padding: 0.85rem 2rem 0.85rem 1.8rem;
      border-radius: 60px;
      color: #d0d9e2;
      text-decoration: none;
      font-weight: 400;
      font-size: 1rem;
      transition: 0.2s ease;
      letter-spacing: 0.2px;
      font-family: 'Inter', sans-serif;
    }

    .email-link i {
      color: #8a9aa8;
      font-size: 1rem;
      transition: 0.2s;
    }

    .email-link .arrow {
      font-size: 0.75rem;
      margin-left: 0.2rem;
      opacity: 0.6;
    }

    .email-link:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(160, 174, 192, 0.15);
      color: #edf2f7;
      transform: scale(1.01);
    }

    .email-link:hover i {
      color: #b8c4d0;
    }

    .email-link:active {
      transform: scale(0.98);
    }

    .note {
      font-size: 0.8rem;
      color: #6b7a88;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.2rem;
      letter-spacing: 0.2px;
    }

    .note i {
      color: #5a6b7c;
      font-size: 0.7rem;
      opacity: 0.7;
    }

    /* social / footer */
    .footer-links {
      margin-top: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      padding-top: 2rem;
    }

    .socials {
      display: flex;
      gap: 1.2rem;
    }

    .socials a {
      color: #7a8a9a;
      font-size: 1.3rem;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.01);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
    }

    .socials a:hover {
      color: #d0d9e2;
      background: rgba(160, 174, 192, 0.04);
      border-color: rgba(160, 174, 192, 0.08);
      transform: translateY(-3px);
    }

    .copy {
      font-size: 0.8rem;
      color: #4a5a68;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .copy i {
      color: #5a6b7c;
      font-size: 0.7rem;
    }

    /* responsive touches */
    @media (max-width: 640px) {
      .hero h1 {
        font-size: 2.6rem;
      }
      .hero p {
        font-size: 1rem;
      }
      .brand-name {
        font-size: 1.6rem;
      }
      .email-link {
        width: 100%;
        justify-content: center;
        padding: 0.9rem 1.5rem;
      }
      .footer-links {
        flex-direction: column-reverse;
        gap: 1.8rem;
        align-items: flex-start;
      }
      .socials a {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }

    @media (max-width: 450px) {
      .card {
        padding: 1.8rem 1.2rem;
      }
      .brand-icon {
        width: 48px;
        height: 48px;
        font-size: 1.8rem;
      }
    }

    /* extra micro-interaction */
    .glow-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- animated background orbs — neutral dark -->
  <div class="orb"></div>
  <div class="orb-secondary"></div>

  <main class="card">
    <!-- brand -->
    <div class="brand">
      <div class="brand-icon">
        <i class="fas fa-cubes"></i>
      </div>
      <span class="brand-name">Domainmont</span>
      <span class="brand-tag">web properties</span>
    </div>

    <!-- hero -->
    <div class="hero">
      <h1>
        <i class="fas fa-arrow-trend-up" style="font-size: 2.8rem; vertical-align: middle; margin-right: 0.2rem;"></i> 
        coming <span style="font-weight: 300;">soon</span>
      </h1>
      <p>
        <strong>Domainmont</strong> builds premium web properties 
        — modern, fast, and crafted for impact. 
        <span style="display: inline-block; margin-top: 0.4rem;">We're launching something fresh. Stay tuned.</span>
      </p>
    </div>

    <!-- chips / status -->
    <div class="chip-group">
      <span class="chip">
        <i class="fas fa-code"></i> 
        <span>Web properties</span>
        <span class="badge">craft</span>
      </span>
      <span class="chip">
        <i class="fas fa-calendar-check"></i> 
        <span>Q3 2026</span>
        <span class="badge highlight"><i class="fas fa-clock" style="margin-right: 4px;"></i>coming</span>
      </span>
      <span class="chip">
        <i class="fas fa-rocket"></i> 
        <span>early access</span>
      </span>
    </div>

    <!-- contact section — click here opens email client to steve@domainmont.com -->
    <div class="contact-section">
      <div class="contact-row">
        <a href="mailto:steve@domainmont.com?subject=Domainmont%20early%20access&body=Hi%20Steve%2C%0A%0AI%27d%20love%20to%20be%20kept%20in%20the%20loop%20on%20Domainmont%27s%20launch.%0A%0AThanks%21" 
           class="email-link"
           aria-label="Email Steve at Domainmont for early access">
          <i class="fas fa-envelope"></i>
          Click here to email Steve
          <i class="fas fa-arrow-right arrow"></i>
        </a>
      </div>
     
    </div>

    <!-- footer / socials -->
    <div class="footer-links">
      <div class="copy">
        <i class="fas fa-copyright"></i> 2026 Domainmont · built with <i class="fas fa-heart" style="color: #8a9aa8; font-size: 0.7rem;"></i>
      </div>
      <div class="socials">
        <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      </div>
    </div>
  </main>
</body>
</html>
