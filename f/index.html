<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waitlist · SnapItForms with redirect</title>
  <!-- Google Fonts for Syne -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    /* minimal reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
    }

    /* waitlist-box style – self-contained */
    .waitlist-box {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1), 0 8px 12px -6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
      text-align: center;
      transition: box-shadow 0.2s;
    }

    .sh-label {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      color: #2563eb;
      background: #eef4ff;
      display: inline-block;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      margin-bottom: 1rem;
      font-family: 'Syne', sans-serif;
    }

    .waitlist-box h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 0.875rem;
      color: #0c1b33;
    }

    .waitlist-box > p {
      color: #3b4e6b;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 460px;
      margin: 0 auto 2rem auto;
    }

    .wl-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .wl-form input[type="email"],
    .wl-form select {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      font-family: inherit;
      border-radius: 60px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      color: #0c1b33;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 1.2rem center;
      background-size: 1.1rem;
    }

    .wl-form input[type="email"] {
      background-image: none;
      background-position: initial;
    }

    .wl-form input[type="email"]:focus,
    .wl-form select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .wl-form input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .wl-submit {
      width: 100%;
      background: #0c1b33;
      color: white;
      font-weight: 600;
      font-size: 1.05rem;
      font-family: 'Syne', sans-serif;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 14px -6px rgba(12, 27, 51, 0.2);
      margin-top: 0.25rem;
    }

    .wl-submit:hover {
      background: #1e2f4a;
      box-shadow: 0 12px 18px -8px rgba(12, 27, 51, 0.3);
    }

    .wl-submit:active {
      transform: scale(0.98);
      background: #071122;
    }

    .wl-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .form-msg {
      font-size: 0.9rem;
      min-height: 1.2rem;
      margin-top: 0.25rem;
      color: #2b6e4e;
      font-weight: 500;
    }
    .form-msg.err {
      color: #b91c1c;
    }

    .wl-note {
      font-size: 0.8rem;
      color: #7b8ba5;
      margin-top: 1.5rem;
      letter-spacing: 0.01em;
      text-align: center;
    }

    select:invalid,
    select option[value=""] {
      color: #94a3b8;
    }

    select {
      color: #0c1b33;
    }

    input[type="hidden"] {
      display: none;
    }

    @media (max-width: 480px) {
      .waitlist-box {
        padding: 2rem 1.25rem;
      }
      .wl-form input[type="email"],
      .wl-form select {
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="waitlist-box reveal">
    <div class="sh-label">Join the Waitlist</div>
    <h2>Be among the first 500</h2>
    <p style="color:var(--text-2); font-size:1rem; line-height:1.7; max-width:460px; margin:0 auto;">
      Get beta access, lifetime pricing, and exclusive strategy guides. We're onboarding traders in order of signup.
    </p>

    <!--
      SnapItForms integration:
      - action="https://api.snapitforms.com/submit"
      - method="POST"
      - hidden access_key input with YOUR key (sf_543cbe8f8cbe211d16438305b29ebc50)
      - We handle submission via JS to enable a custom redirect after success.
    -->
    <form 
      id="snapitForm" 
      class="wl-form snapit-form" 
      action="https://api.snapitforms.com/submit" 
      method="POST" 
      enctype="multipart/form-data"
    >
      <!-- SnapItForms access key (required) -->
      <input type="hidden" name="access_key" value="sf_543cbe8f8cbe211d16438305b29ebc50">
      
      <!-- additional hidden fields -->
      <input type="hidden" name="_subject" value="New KalshiBot Waitlist Signup">
      
      <input type="email" name="email" id="wlEmail" placeholder="your@email.com" required>
      
      <select name="trading_volume" id="wlVolume" required>
        <option value="">Monthly trading volume (required)</option>
        <option value="Under $1k">Under $1k — casual trader</option>
        <option value="$1k–$10k">$1k–$10k — active trader</option>
        <option value="$10k–$50k">$10k–$50k — high volume</option>
        <option value="Over $50k">Over $50k — institutional</option>
      </select>
      
      <select name="interested_plan" id="wlPlan">
        <option value="">Interested plan (optional)</option>
        <option value="Starter">Starter — $29/mo</option>
        <option value="Pro">Pro — $79/mo</option>
        <option value="Enterprise">Enterprise — custom</option>
      </select>
      
      <input type="hidden" name="affiliate_source" id="wlSrc" value="">
      <input type="hidden" name="affiliate_campaign" id="wlCampaign" value="">
      
      <!-- Optional: SnapItForms redirect URL – can also be set in dashboard -->
      <input type="hidden" name="redirect" value="https://kalshibot.com/thank-you-sales.html">
      
      <button type="submit" class="wl-submit" id="wlBtn">Reserve My Spot →</button>
      
      <div class="form-msg" id="formMsg"></div>
    </form>

    <p class="wl-note">No spam. Unsubscribe anytime. Trading involves risk.</p>
  </div>

  <script>
    /* Nav scroll */
    const nav = document.getElementById('nav');
    if (nav) {
      window.addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 40));
    }

    /* Reveal */
    const ro = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('active'); ro.unobserve(e.target); } }), {threshold:0.08});
    document.querySelectorAll('.reveal').forEach(el => ro.observe(el));

    /* FAQ */
    function toggleFaq(btn) {
      const item = btn.parentElement;
      const was = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
      if(!was) item.classList.add('open');
    }

    /* Plan prefill */
    window.prefill = function(plan) {
      const s = document.getElementById('wlPlan');
      if(s) s.value = plan;
      document.getElementById('waitlist').scrollIntoView({behavior:'smooth'});
      setTimeout(() => document.getElementById('wlEmail').focus(), 500);
    };

    /* Affiliate tracking */
    (function() {
      const p = new URLSearchParams(location.search);
      const srcField = document.getElementById('wlSrc');
      const campaignField = document.getElementById('wlCampaign');
      if (srcField) srcField.value = p.get('ref') || p.get('source') || document.referrer || 'direct';
      if (campaignField) campaignField.value = p.get('utm_campaign') || p.get('campaign') || 'organic';
      const plan = p.get('plan');
      if(plan) { const s = document.getElementById('wlPlan'); if(s) s.value = plan; }
    })();

    /* Custom submission handler to enable redirect after success */
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('snapitForm');
      const msg = document.getElementById('formMsg');
      const btn = document.getElementById('wlBtn');

      if (!form) return;

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Basic client-side check
        const volume = document.getElementById('wlVolume').value;
        if (!volume) {
          msg.className = 'form-msg err';
          msg.textContent = 'Please select your trading volume.';
          return;
        }

        // UI feedback
        btn.disabled = true;
        btn.textContent = 'Submitting…';
        msg.className = 'form-msg';
        msg.textContent = '';

        const data = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
          });

          if (res.ok) {
            // ✅ Redirect to your thank-you page after success
            window.location.href = 'https://kalshibot.com/thank-you-sales.html';
          } else {
            let errMsg = 'Submission failed. Please try again.';
            try {
              const json = await res.json();
              if (json.error) errMsg = json.error;
            } catch (_) {}
            throw new Error(errMsg);
          }
        } catch (err) {
          msg.className = 'form-msg err';
          msg.textContent = err.message || 'Something went wrong. Please try again or email us directly.';
          btn.disabled = false;
          btn.textContent = 'Reserve My Spot →';
        }
      });
    });
  </script>
</body>
</html>
